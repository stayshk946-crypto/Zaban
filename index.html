<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>زبان‌آموز</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#E6F2FF" />
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="logo">🌍 <span class="app-name">زبان‌آموز</span></div>
      <div class="top-actions">
        <button id="themeToggle" class="icon-btn" aria-label="تغییر حالت">🌗</button>
        <button id="settingsBtn" class="icon-btn" aria-label="تنظیمات">⚙️</button>
      </div>
    </header>

    <main class="container">
      <section id="home" class="page">
        <div class="welcome card">
          <div class="welcome-left">
            <h1>خوش آمدی، <span id="userName">کاربر</span>!</h1>
            <p class="muted">یادگیری زبان را جذاب کن · روزی چند دقیقه</p>
            <div class="stats-row">
              <div class="stat">
                <div class="big">XP</div>
                <div id="xpValue">0</div>
              </div>
              <div class="stat">
                <div class="big">سطح</div>
                <div id="levelValue">0</div>
              </div>
              <div class="stat">
                <div class="big">روزهای متوالی</div>
                <div id="streakValue">0</div>
              </div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label">پیشرفت</div>
              <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
              </div>
            </div>
          </div>
          <div class="welcome-right">
            <img src="assets/avatar.svg" alt="آواتار" class="avatar">
          </div>
        </div>

        <div class="cards-grid">
          <button class="main-card" data-route="learn">📚 یادگیری</button>
          <button class="main-card" data-route="quiz">🧠 آزمون</button>
          <button class="main-card" data-route="vocab">📖 واژگان</button>
          <button class="main-card" data-route="daily">🎯 تمرین روزانه</button>
          <button class="main-card" data-route="profile">👤 پروفایل</button>
          <button class="main-card" data-route="achievements">🏆 دستاوردها</button>
        </div>
      </section>

      <section id="profile" class="page hidden">
        <div class="card profile-card">
          <div class="profile-top">
            <img id="profileAvatar" src="assets/avatar.svg" alt="آواتار" class="avatar large">
            <div>
              <div class="profile-name-row">
                <h2 id="profileName">کاربر</h2>
                <button id="editNameBtn" class="btn small">تغییر نام</button>
              </div>
              <div class="muted">سطح <span id="profileLevel">0</span> · XP <span id="profileXP">0</span></div>
            </div>
          </div>

          <div class="profile-stats">
            <div class="stat-block">
              <div class="stat-num" id="correctAnswers">0</div>
              <div class="stat-title">پاسخ‌های درست</div>
            </div>
            <div class="stat-block">
              <div class="stat-num" id="wordsLearned">0</div>
              <div class="stat-title">کلمات یادگرفته‌شده</div>
            </div>
            <div class="stat-block">
              <div class="stat-num" id="progressPercent">0%</div>
              <div class="stat-title">درصد پیشرفت</div>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-label">پیشرفت کلی</div>
            <div class="progress">
              <div id="profileProgressBar" class="progress-bar"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="quiz" class="page hidden">
        <div class="card quiz-card">
          <div id="quizContainer">
            <div id="questionCard" class="question-card">
              <div id="questionText" class="question-text">سوال نمونه</div>
              <div id="options" class="options"></div>
            </div>
            <div id="quizResult" class="quiz-result hidden">
              <div id="resultMessage" class="result-message"></div>
              <div class="result-meta">امتیاز: <span id="quizScore">0</span></div>
              <button id="nextQuestionBtn" class="btn">سؤال بعدی</button>
              <button id="endQuizBtn" class="btn outline">پایان آزمون</button>
            </div>
          </div>
        </div>
      </section>

      <section id="vocab" class="page hidden">
        <div class="card vocab-card">
          <div class="vocab-header">
            <h2>واژگان</h2>
            <div>
              <button id="addWordBtn" class="btn">افزودن کلمه</button>
            </div>
          </div>
          <div id="vocabList" class="vocab-list"></div>
        </div>
      </section>

      <section id="daily" class="page hidden">
        <div class="card">
          <h2>تمرین روزانه</h2>
          <p class="muted">هر روز یک تمرین کوتاه برای حفظ کردن عادت</p>
          <button id="startDailyBtn" class="btn">شروع تمرین</button>
        </div>
      </section>

      <section id="achievements" class="page hidden">
        <div class="card">
          <h2>دستاوردها</h2>
          <div id="badges" class="badges"></div>
        </div>
      </section>

    </main>

    <nav class="bottomnav">
      <button class="nav-btn" data-route="home">خانه</button>
      <button class="nav-btn" data-route="learn">یادگیری</button>
      <button class="nav-btn" data-route="quiz">آزمون</button>
      <button class="nav-btn" data-route="vocab">واژگان</button>
      <button class="nav-btn" data-route="profile">پروفایل</button>
    </nav>

    <!-- Modals -->
    <div id="modal" class="modal hidden" role="dialog" aria-hidden="true">
      <div class="modal-card">
        <h3 id="modalTitle">عنوان</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
          <button id="modalClose" class="btn outline">بستن</button>
          <button id="modalSave" class="btn">ذخیره</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
